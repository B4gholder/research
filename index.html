<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bagholder Research</title>
<meta name="description" content="產業與個股研究報告整理，非投資建議。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F0; --panel:#E4E9E8; --ink:#17252E; --muted:#56646C; --rule:#C6CFD0;
  --signal:#0B7A83; --signal-soft:rgba(11,122,131,.10);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E191E; --panel:#15242B; --ink:#E2E9EB; --muted:#94A3A9; --rule:#2A3B43;
    --signal:#4CC2C9; --signal-soft:rgba(76,194,201,.10);
  }
}
:root[data-theme="dark"]{
  --paper:#0E191E; --panel:#15242B; --ink:#E2E9EB; --muted:#94A3A9; --rule:#2A3B43;
  --signal:#4CC2C9; --signal-soft:rgba(76,194,201,.10);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:56px 22px 80px}
h1{font-family:var(--serif);font-size:clamp(30px,7vw,42px);line-height:1.25;margin:0 0 10px;letter-spacing:.01em}
.intro{color:var(--muted);margin:0 0 40px;max-width:34em}
.count{font-size:14px;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:8px;margin:0}
ol.reports{list-style:none;margin:0;padding:0}
ol.reports li{border-bottom:1px solid var(--rule)}
ol.reports a{display:block;padding:22px 12px 22px 0;color:inherit;text-decoration:none;border-radius:4px;transition:background-color .15s ease}
ol.reports a:hover{background:var(--signal-soft)}
ol.reports a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.date{font-size:14px;color:var(--muted);display:block;margin-bottom:4px;font-variant-numeric:tabular-nums}
.title{font-family:var(--serif);font-size:21px;line-height:1.4;display:block;margin-bottom:6px}
ol.reports a:hover .title{color:var(--signal)}
.summary{display:block;color:var(--muted);font-size:15.5px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:13px;padding:1px 9px;border:1px solid var(--rule);border-radius:99px;color:var(--muted)}
footer{margin-top:48px;font-size:13.5px;color:var(--muted);line-height:1.7}
@media (max-width:480px){main{padding:40px 18px 64px}.title{font-size:19px}}
@media (prefers-reduced-motion:reduce){ol.reports a{transition:none}}
</style>
</head>
<body>
<main>
<h1>Bagholder Research</h1>
<p class="intro">產業與個股的研究整理，重點放在技術怎麼運作、誰在供應鏈的哪個位置，以及市場說法背後的數字。</p>

<p class="count">報告列表</p>
<ol class="reports">
<!--
  新增報告：複製下面一整段 <li>...</li>，貼在最上面（最新的放第一個），
  改掉 href 檔名、日期、標題、摘要和標籤即可。
-->
  <li>
    <a href="dsp.html">
      <span class="date">2026-09-24</span>
      <span class="title">達發（6526）PAM4 DSP 深度研究</span>
      <span class="summary">達發是已在出貨的 DSP 替代供應商，800G 缺貨給了接單機會，但規模約只有 MaxLinear 的五分之一到七分之一，1.6T 世代還沒有產品。</span>
      <span class="tags"><span>光通訊</span><span>DSP</span><span>台股</span></span>
    </a>
  </li>
</ol>

<footer>所有內容為產業資訊整理，不構成投資建議。文中估算數字均已標明假設，實際數據以公司公告為準。</footer>
</main>
</body>
</html>
